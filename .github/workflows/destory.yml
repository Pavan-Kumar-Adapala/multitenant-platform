name: Destroy Infrastructure

on:
  workflow_dispatch:

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    env:
      TF_VAR_statefile_bucket_name: ${{ secrets.STATEFILE_BUCKET_NAME }}
      TF_VAR_statefile_bucket_region: ${{ secrets.STATEFILE_BUCKET_REGION }}
      TF_VAR_aws_region: ${{ secrets.AWS_DEFAULT_REGION }}
      TF_VAR_vpc_id: ${{ secrets.VPC_ID }}
      TF_VAR_subnet_id: ${{ secrets.SUBNET_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra/environments/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.STATEFILE_BUCKET_NAME }}" \
            -backend-config="region=${{ secrets.STATEFILE_BUCKET_REGION }}"

      - name: Clean up stale state entries
        working-directory: infra/environments/dev
        run: |
          # Disable exit-on-error so terraform state rm failing (resource not found)
          # does not kill this step — bash -e would otherwise stop here
          set +e
          terraform state rm aws_iam_service_linked_role.ecs
          set -e
          echo "State cleanup done (resource may not have existed — that is fine)"

      - name: Terraform Destroy
        working-directory: infra/environments/dev
        run: terraform destroy -auto-approve
