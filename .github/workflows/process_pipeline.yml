name: Multitenant Platform Pipeline

# Triggers when anyone publishes a GitHub Release.
# Attach exactly ONE .zip file as a release asset.
on:
  release:
    types: [published]

jobs:
  deploy:
    name: Provision Infra & Process File
    runs-on: ubuntu-latest

    env:
      TF_VAR_statefile_bucket_name: ${{ secrets.STATEFILE_BUCKET_NAME }}
      TF_VAR_statefile_bucket_region: ${{ secrets.STATEFILE_BUCKET_REGION }}
      TF_VAR_aws_region: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1. Validate release has exactly one .zip asset ─────────────────────
      #    Uses contains(".zip") so filenames like __raw__data.zip__ are matched
      - name: Check release asset
        id: asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=$(gh release view "${{ github.event.release.tag_name }}" \
                     --json assets -q '.assets')

          echo "All release assets:"
          echo "$ASSETS" | jq -r '.[].name'

          # Match any asset whose name contains ".zip" (handles __raw__name.zip__ etc.)
          COUNT=$(echo "$ASSETS" | jq '[.[] | select(.name | contains(".zip"))] | length')

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No .zip file found in release assets."
            echo "Please attach a .zip file when creating the release."
            exit 1
          fi
          if [ "$COUNT" -gt 1 ]; then
            echo "ERROR: More than one .zip found. Please attach only one."
            exit 1
          fi

          # Original asset name (may have messy prefix/suffix like __raw__data.zip__)
          ZIP_ORIGINAL=$(echo "$ASSETS" | jq -r '[.[] | select(.name | contains(".zip"))][0].name')
          ZIP_URL=$(echo  "$ASSETS" | jq -r '[.[] | select(.name | contains(".zip"))][0].url')

          # Normalize: strip everything except the clean base.zip portion
          # e.g. "__raw_____data.zip__" → "data.zip"
          ZIP_NAME=$(echo "$ZIP_ORIGINAL" | sed 's/^[^a-zA-Z0-9]*//' | sed 's/[^a-zA-Z0-9._-]*$//')

          echo "Original asset name : $ZIP_ORIGINAL"
          echo "Normalized filename : $ZIP_NAME"

          echo "zip_original=$ZIP_ORIGINAL" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME"         >> $GITHUB_OUTPUT
          echo "zip_url=$ZIP_URL"           >> $GITHUB_OUTPUT

      # ── 2. Download zip from release assets ────────────────────────────────
      #    Downloads by exact original name, then renames to the clean filename
      - name: Download zip asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ORIGINAL="${{ steps.asset.outputs.zip_original }}"
          CLEAN="${{ steps.asset.outputs.zip_name }}"

          echo "Downloading: $ORIGINAL"
          gh release download "${{ github.event.release.tag_name }}" \
            --pattern "$ORIGINAL" \
            --output "$ORIGINAL"

          # Rename to clean filename if different
          if [ "$ORIGINAL" != "$CLEAN" ]; then
            mv "$ORIGINAL" "$CLEAN"
            echo "Renamed: $ORIGINAL → $CLEAN"
          fi

          echo "Ready: $CLEAN"
          ls -lh "$CLEAN"

      # ── 3. Terraform — provision all infrastructure ─────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra/environments/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.STATEFILE_BUCKET_NAME }}" \
            -backend-config="region=${{ secrets.STATEFILE_BUCKET_REGION }}"

      - name: Terraform Validate
        working-directory: infra/environments/dev
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra/environments/dev
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: infra/environments/dev
        run: terraform apply -auto-approve tfplan

      # ── 4. Build & push processor Docker image to ECR ──────────────────────
      #    (must happen AFTER Terraform creates the ECR repo,
      #     BEFORE uploading the zip so ECS has an image to pull)
      - name: Configure AWS credentials for ECR login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push processor image
        run: |
          ECR_URL=$(terraform -chdir=infra/environments/dev output -raw ecr_repository_url)
          IMAGE_TAG="${ECR_URL}:latest"

          echo "Building image → $IMAGE_TAG"
          docker build -t "$IMAGE_TAG" src/processor/

          echo "Pushing image → $IMAGE_TAG"
          docker push "$IMAGE_TAG"
          echo "Image pushed successfully."

        # ── 5. Upload zip to S3 ────────────────────────────────────────────────
      #    Upload first, then apply tags separately — avoids --tagging + --metadata
      #    parse conflicts. S3 PutObject event auto-triggers Lambda validator.
      - name: Upload zip to S3
        run: |
          BUCKET=$(terraform -chdir=infra/environments/dev output -raw upload_bucket_name)
          FILE="${{ steps.asset.outputs.zip_name }}"
          ORG_ID="${{ github.repository_owner }}"
          S3_KEY="uploads/$FILE"

          # Step 1: plain upload — no extra flags
          echo "Uploading $FILE → s3://$BUCKET/$S3_KEY"
          aws s3 cp "$FILE" "s3://$BUCKET/$S3_KEY"

          # Step 2: apply organization-id tag separately (Lambda reads this tag)
          echo "Tagging with organization-id=${ORG_ID}"
          aws s3api put-object-tagging \
            --bucket "$BUCKET" \
            --key "$S3_KEY" \
            --tagging "TagSet=[{Key=organization-id,Value=${ORG_ID}},{Key=uploaded-by,Value=${{ github.actor }}}]"

          echo "Upload + tagging complete. Lambda will be invoked automatically via S3 event."

      # ── 6. Wait and show audit trail ───────────────────────────────────────
      - name: Wait for Lambda + ECS to run (30 s)
        run: sleep 30

      - name: Show audit records from DynamoDB
        run: |
          TABLE=$(terraform -chdir=infra/environments/dev output -raw audit_table_name)
          ORG_ID="${{ github.repository_owner }}"

          echo "Querying audit records for org_id=$ORG_ID …"
          aws dynamodb query \
            --table-name "$TABLE" \
            --key-condition-expression "org_id = :oid" \
            --expression-attribute-values "{\":oid\":{\"S\":\"$ORG_ID\"}}" \
            --output table \
            --query 'Items[*].{Event:event_type.S,Status:status.S,Details:details.S,SK:event_sk.S}' \
          || echo "(No records yet — ECS task may still be starting)"
