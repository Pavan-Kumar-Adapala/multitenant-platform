name: Multitenant Platform Pipeline

on:
  release:
    types: [published]

jobs:
  deploy:
    name: Provision Infra & Process File
    runs-on: ubuntu-latest

    env:
      TF_VAR_statefile_bucket_name: ${{ secrets.STATEFILE_BUCKET_NAME }}
      TF_VAR_statefile_bucket_region: ${{ secrets.STATEFILE_BUCKET_REGION }}
      TF_VAR_aws_region: ${{ secrets.AWS_DEFAULT_REGION }}
      TF_VAR_vpc_id: ${{ secrets.VPC_ID }}
      TF_VAR_subnet_id: ${{ secrets.SUBNET_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ══════════════════════════════════════════════════════════════
      # STEP 1 — Validate release asset
      # ══════════════════════════════════════════════════════════════
      - name: "[1/7] Validate release asset"
        id: asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "============================================================"
          echo "  STEP 1/7 — Validating Release Asset"
          echo "  Release tag : ${{ github.event.release.tag_name }}"
          echo "  Released by : ${{ github.actor }}"
          echo "  Repository  : ${{ github.repository }}"
          echo "============================================================"

          ASSETS=$(gh release view "${{ github.event.release.tag_name }}" \
                     --json assets -q '.assets')

          echo ""
          echo "Assets attached to this release:"
          echo "$ASSETS" | jq -r '.[] | "  - \(.name)"'
          echo ""

          COUNT=$(echo "$ASSETS" | jq '[.[] | select(.name | contains(".zip"))] | length')
          echo "  .zip assets found: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "FAILED: No .zip file found. Please attach a .zip to the release."
            exit 1
          fi
          if [ "$COUNT" -gt 1 ]; then
            echo "FAILED: Multiple .zip files found. Attach only one."
            exit 1
          fi

          ZIP_ORIGINAL=$(echo "$ASSETS" | jq -r '[.[] | select(.name | contains(".zip"))][0].name')
          ZIP_URL=$(echo  "$ASSETS" | jq -r '[.[] | select(.name | contains(".zip"))][0].url')
          ZIP_NAME=$(echo "$ZIP_ORIGINAL" | sed 's/^[^a-zA-Z0-9]*//' | sed 's/[^a-zA-Z0-9._-]*$//')

          echo ""
          echo "  Original name : $ZIP_ORIGINAL"
          echo "  Clean name    : $ZIP_NAME"
          echo "  PASSED: Asset validated successfully"

          echo "zip_original=$ZIP_ORIGINAL" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME"         >> $GITHUB_OUTPUT
          echo "zip_url=$ZIP_URL"           >> $GITHUB_OUTPUT

      # ══════════════════════════════════════════════════════════════
      # STEP 2 — Download zip
      # ══════════════════════════════════════════════════════════════
      - name: "[2/7] Download zip asset"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "============================================================"
          echo "  STEP 2/7 — Downloading Zip Asset"
          echo "============================================================"

          ORIGINAL="${{ steps.asset.outputs.zip_original }}"
          CLEAN="${{ steps.asset.outputs.zip_name }}"

          echo "  Downloading: $ORIGINAL"
          gh release download "${{ github.event.release.tag_name }}" \
            --pattern "$ORIGINAL" \
            --output "$ORIGINAL"

          if [ "$ORIGINAL" != "$CLEAN" ]; then
            mv "$ORIGINAL" "$CLEAN"
            echo "  Renamed: $ORIGINAL -> $CLEAN"
          fi

          echo ""
          echo "  File details:"
          ls -lh "$CLEAN"
          echo "  DONE: Download complete"

      # ══════════════════════════════════════════════════════════════
      # STEP 3 — Terraform provision infrastructure
      # ══════════════════════════════════════════════════════════════
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: "[3/7] Terraform Init"
        working-directory: infra/environments/dev
        run: |
          echo "============================================================"
          echo "  STEP 3a/7 — Terraform Init"
          echo "  State bucket : ${{ secrets.STATEFILE_BUCKET_NAME }}"
          echo "  Region       : ${{ secrets.STATEFILE_BUCKET_REGION }}"
          echo "============================================================"
          terraform init \
            -backend-config="bucket=${{ secrets.STATEFILE_BUCKET_NAME }}" \
            -backend-config="region=${{ secrets.STATEFILE_BUCKET_REGION }}"

      - name: "[3/7] Terraform Validate + Plan"
        working-directory: infra/environments/dev
        run: |
          echo "============================================================"
          echo "  STEP 3b/7 — Terraform Validate & Plan"
          echo "============================================================"
          terraform validate
          echo "  Validation passed"
          echo ""
          terraform plan -out=tfplan

      - name: "[3/7] Terraform Apply"
        working-directory: infra/environments/dev
        run: |
          echo "============================================================"
          echo "  STEP 3c/7 — Terraform Apply"
          echo "============================================================"
          terraform apply -auto-approve tfplan

          echo ""
          echo "  Infrastructure provisioned:"
          echo "    S3 Bucket   : $(terraform output -raw upload_bucket_name)"
          echo "    Lambda      : $(terraform output -raw processor_function_name)"
          echo "    DynamoDB    : $(terraform output -raw audit_table_name)"
          echo "    ECR         : $(terraform output -raw ecr_repository_url)"
          echo "    ECS Cluster : $(terraform output -raw ecs_cluster_name)"

      # ══════════════════════════════════════════════════════════════
      # STEP 4 — Build & push Docker image to ECR
      # ══════════════════════════════════════════════════════════════
      - name: Configure AWS credentials for ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: "[4/7] Build and push processor Docker image"
        run: |
          echo "============================================================"
          echo "  STEP 4/7 — Build & Push Docker Image to ECR"
          echo "============================================================"

          ECR_URL=$(terraform -chdir=infra/environments/dev output -raw ecr_repository_url)
          IMAGE_TAG="${ECR_URL}:latest"

          echo "  ECR URL   : $ECR_URL"
          echo "  Image tag : $IMAGE_TAG"
          echo ""
          echo "  Building..."
          docker build -t "$IMAGE_TAG" src/processor/

          echo ""
          echo "  Pushing to ECR..."
          docker push "$IMAGE_TAG"

          echo ""
          echo "  DONE: Image pushed -> $IMAGE_TAG"

      # ══════════════════════════════════════════════════════════════
      # STEP 5 — Upload zip to S3 (auto-triggers Lambda via S3 event)
      # ══════════════════════════════════════════════════════════════
      - name: "[5/7] Upload zip to S3"
        id: upload
        run: |
          echo "============================================================"
          echo "  STEP 5/7 — Upload Zip to S3"
          echo "============================================================"

          BUCKET=$(terraform -chdir=infra/environments/dev output -raw upload_bucket_name)
          FILE="${{ steps.asset.outputs.zip_name }}"
          ORG_ID="${{ github.repository_owner }}"
          S3_KEY="uploads/$FILE"

          echo "  Bucket   : $BUCKET"
          echo "  File     : $FILE"
          echo "  S3 key   : $S3_KEY"
          echo "  Org ID   : $ORG_ID"
          echo "  Actor    : ${{ github.actor }}"
          echo ""

          echo "  Uploading file..."
          aws s3 cp "$FILE" "s3://$BUCKET/$S3_KEY"
          echo "  Upload done"

          echo "  Applying tags..."
          aws s3api put-object-tagging \
            --bucket "$BUCKET" \
            --key "$S3_KEY" \
            --tagging "TagSet=[{Key=organization-id,Value=${ORG_ID}},{Key=uploaded-by,Value=${{ github.actor }}}]"

          echo "  Tags applied: organization-id=$ORG_ID"
          echo ""
          echo "  DONE: s3://$BUCKET/$S3_KEY"
          echo "  S3 PutObject event fired -> Lambda validator auto-triggered"

          echo "s3_bucket=$BUCKET" >> $GITHUB_OUTPUT
          echo "s3_key=$S3_KEY"    >> $GITHUB_OUTPUT

      # ══════════════════════════════════════════════════════════════
      # STEP 6 — Stream Lambda validator logs
      # ══════════════════════════════════════════════════════════════
      - name: "[6/7] Stream Lambda validator logs"
        run: |
          echo "============================================================"
          echo "  STEP 6/7 — Lambda Validator Execution Logs"
          echo "============================================================"

          FUNCTION=$(terraform -chdir=infra/environments/dev output -raw processor_function_name)
          LOG_GROUP="/aws/lambda/$FUNCTION"

          echo "  Function  : $FUNCTION"
          echo "  Log group : $LOG_GROUP"
          echo ""
          echo "  Waiting 15s for Lambda to execute..."
          sleep 15

          echo ""
          echo "  ---- Lambda logs (last 60s) --------------------------------"
          aws logs tail "$LOG_GROUP" \
            --since 60s \
            --format short \
          || echo "  (No Lambda logs yet)"
          echo "  ---- end Lambda logs ---------------------------------------"

      # ══════════════════════════════════════════════════════════════
      # STEP 7 — Stream ECS processor logs + final audit trail
      # ══════════════════════════════════════════════════════════════
      - name: "[7/7] Stream ECS processor logs + audit trail"
        run: |
          echo "============================================================"
          echo "  STEP 7/7 — ECS Fargate Processor Logs + Audit Trail"
          echo "============================================================"

          ECS_LOG_GROUP="/ecs/multitenant-platform-dev-processor"
          TABLE=$(terraform -chdir=infra/environments/dev output -raw audit_table_name)
          ORG_ID="${{ github.repository_owner }}"

          echo "  ECS log group : $ECS_LOG_GROUP"
          echo "  DynamoDB table: $TABLE"
          echo "  Org ID        : $ORG_ID"
          echo ""
          echo "  Waiting 45s for Fargate task to complete..."
          sleep 45

          echo ""
          echo "  ---- ECS container logs (last 120s) ------------------------"
          aws logs tail "$ECS_LOG_GROUP" \
            --since 120s \
            --format short \
          || echo "  (No ECS logs yet — task may still be starting)"
          echo "  ---- end ECS logs ------------------------------------------"

          echo ""
          echo "  ---- DynamoDB audit trail ----------------------------------"
          echo "  Expected: VALIDATED -> PROCESSING_START -> COMPLETE"
          echo ""
          aws dynamodb query \
            --table-name "$TABLE" \
            --key-condition-expression "org_id = :oid" \
            --expression-attribute-values "{\":oid\":{\"S\":\"$ORG_ID\"}}" \
            --output table \
            --query 'Items[*].{Timestamp:timestamp.S,Event:event_type.S,Status:status.S,Details:details.S}' \
          || echo "  (No records found)"
          echo "  ---- end audit trail ---------------------------------------"

          echo ""
          echo "============================================================"
          echo "  Pipeline complete"
          echo "  Lambda logs : /aws/lambda/$(terraform -chdir=infra/environments/dev output -raw processor_function_name)"
          echo "  ECS logs    : /ecs/multitenant-platform-dev-processor"
          echo "  DynamoDB    : $TABLE"
          echo "============================================================"
